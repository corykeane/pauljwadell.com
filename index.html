<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul J. Wadell — Coming Soon</title>
<meta name="description" content="The official website of Paul J. Wadell, author and theologian, is coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF8F2;
    --ink: #232A38;
    --oxblood: #722F37;
    --muted: #6B6F77;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 32rem;
    width: 100%;
  }

  .name {
    font-size: 0.8rem;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .rule {
    border: none;
    border-top: 1px solid var(--ink);
    width: 4rem;
    margin: 1.75rem auto;
    opacity: 0.35;
  }

  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-size: clamp(3rem, 11vw, 5.25rem);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.05;
  }

  .tagline {
    font-style: italic;
    font-size: 1.1rem;
    color: var(--muted);
    margin-top: 1.5rem;
    line-height: 1.7;
  }

  .fleuron {
    color: var(--oxblood);
    font-size: 1.2rem;
    margin-top: 2.25rem;
    user-select: none;
  }

  .rise {
    opacity: 0;
    transform: translateY(10px);
    animation: settle 0.9s ease-out forwards;
  }
  .rise:nth-child(1) { animation-delay: 0.05s; }
  .rise:nth-child(2) { animation-delay: 0.2s; }
  .rise:nth-child(3) { animation-delay: 0.35s; }
  .rise:nth-child(4) { animation-delay: 0.5s; }
  .rise:nth-child(5) { animation-delay: 0.65s; }

  @keyframes settle {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .rise { opacity: 1; transform: none; animation: none; }
  }
</style>
</head>
<body>
  <main class="page">
    <p class="name rise">Paul J. Wadell</p>

    <hr class="rule rise" aria-hidden="true">

    <h1 class="rise">Coming<br>Soon</h1>

    <p class="tagline rise">
      A new home for writing on friendship, virtue,<br>
      and the Christian moral life.
    </p>

    <div class="fleuron rise" aria-hidden="true">❦</div>
  </main>
</body>
</html>
